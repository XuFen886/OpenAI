<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的AI助手</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        textarea { width: 100%; height: 100px; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #chatBox { margin-top: 20px; min-height: 300px; border: 1px solid #ddd; padding: 10px; border-radius: 5px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background: #007bff; color: white; text-align: right; }
        .ai { background: #f1f1f1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎来到我的AI网站</h1>
        <p>输入问题后点击发送</p>
        
        <textarea id="userInput" placeholder="问人工智能一些问题......"></textarea>
        <button onclick="sendMessage()">发送</button>
        
        <div id="chatBox"></div>
        
<script>
    let apiKey = localStorage.getItem("openai_key");

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const message = input.value.trim();
        
        if (!message) return;

        // 如果没有保存 Key，就提示输入
        if (!apiKey) {
            apiKey = prompt("请输入你的 OpenAI API Key（sk- 开头）：");
            if (!apiKey) return;
            localStorage.setItem("openai_key", apiKey);   // 浏览器记住 Key
        }

        // 显示用户消息
        chatBox.innerHTML += `<div class="message user">${message}</div>`;
        input.value = "";

        try {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{ role: "user", content: message }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                chatBox.innerHTML += `<div class="message ai" style="color:red;">错误：${data.error.message}</div>`;
            } else {
                const aiReply = data.choices[0].message.content;
                chatBox.innerHTML += `<div class="message ai">${aiReply}</div>`;
            }
        } catch (err) {
            chatBox.innerHTML += `<div class="message ai" style="color:red;">请求失败，请检查网络或 API Key</div>`;
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
